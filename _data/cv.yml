        highlights:
          - In collaboration with Ashoka University.
          - Member of an 8-person research team developing a benchmark dataset and evaluation framework for automated medical scribe systems that process physician–patient conversations and generate structured clinical documentation, including SOAP notes.
          - Conducted an in-depth literature review of existing automated medical scribe systems and qualitative, semi-structured studies to understand the current development and deployment landscape of such systems.
          - Conducted a quantitative comparative analysis of publicly available benchmark datasets, focusing on linguistic coverage, language characteristics, and conversational structure; also supervised and mentored junior members of the research team.

