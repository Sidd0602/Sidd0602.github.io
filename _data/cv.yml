  summary: My research focuses on evaluating and improving the reliability and performance of AI-mediated human-interfaced systems. I am interested in developing methods to evaluate and mitigate disparities in large-scale platforms across multimodal settings, with an emphasis on underrepresented populations and Global societal contexts. More broadly, my work explores how modern AI-based systems interact with human decision-making, platform governance, and real-world societal outcomes.

